# Cloudflare. Connect the repo in the dashboard (Workers & Pages > Create > Import a repository)
# and every push to main deploys: no build step, the default `npx wrangler deploy` is enough.
name = "moonbase-manager"
main = "worker/index.js"
compatibility_date = "2025-09-01"

[assets]
directory = "./client"
binding = "ASSETS"
# No redirecting /console.html to /console: the worker rewrites /ops etc. onto the HTML files
# and the console reads its seat from the path it was opened at.
html_handling = "none"

[[durable_objects.bindings]]
name = "GAME"
class_name = "GameRoom"

# SQLite-backed objects are the kind the free plan allows. The room keeps nothing in storage;
# the class just has to be declared this way.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["GameRoom"]
