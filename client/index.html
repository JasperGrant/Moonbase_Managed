<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>Moonbase</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
  <div id="lobby"></div>
  <noscript><p style="padding:2em">Moonbase needs JavaScript. Seats: <a href="/astronaut">Astronaut</a>, <a href="/ops">Mission Ops</a>, <a href="/sci">Scientist</a>, <a href="/tech">Technician</a>, <a href="/control">Mission Control (2-player)</a>.</p></noscript>
  <script type="module">
    // The landing page is the lobby before you have a seat: click a grey scene to take that role.
    // It asks the server who is in once a second.
    import { createLobby } from '/lobby.js';
    const URLS = { astronaut: '/astronaut', ops: '/ops', sci: '/sci', tech: '/tech' };
    const lobby = createLobby(document.getElementById('lobby'), { onPick: role => { location.href = URLS[role]; } });
    async function refresh() {
      try { lobby.update(await (await fetch('/seats', { cache: 'no-store' })).json()); } catch {}
    }
    refresh(); setInterval(refresh, 1000);
  </script>
</body>
</html>
