<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>Moonbase</title>
<link rel="stylesheet" href="/style.css">
<link rel="stylesheet" href="/landing.css">
<script type="importmap">{ "imports": { "three": "/vendor/three/build/three.module.js", "three/addons/": "/vendor/three/examples/jsm/" } }</script>
</head>
<body class="landing-page">
  <!-- The base in 3D, drifting; a still of the same shot shows until it is ready, or instead of it on a weak device. -->
  <img id="still" src="/landing.jpg" alt="" aria-hidden="true">
  <canvas id="scene" aria-hidden="true"></canvas>
  <div class="shade" aria-hidden="true"></div>

  <main id="front">
    <header>
      <p class="kicker">Connecting Ridge &middot; lunar south pole</p>
      <h1>MOONBASE</h1>
      <p class="tag">A co-op fix-it game. One astronaut on the Moon, mission control 384,000 km away.</p>
    </header>

    <section id="choose" hidden>
      <p class="ask">How many are playing?</p>
      <div class="modes">
        <button class="mode" type="button" data-players="2">
          <span class="num">2</span><span class="word">players</span>
          <span class="who">Astronaut and Mission Operator</span>
          <span class="more">The operator runs every screen on Earth</span>
        </button>
        <button class="mode" type="button" data-players="4">
          <span class="num">4</span><span class="word">players</span>
          <span class="who">Every role, one seat each</span>
          <span class="more">Astronaut, Mission Ops, Scientist and Technician</span>
        </button>
      </div>
    </section>

    <section id="join" hidden>
      <p class="ask" id="joinText"></p>
      <p class="open" id="joinOpen"></p>
      <button class="mode join" type="button" id="joinBtn"></button>
    </section>

    <p id="headsetNote" class="note" hidden>You are in a headset, so you will be the <b>Astronaut</b>.</p>
    <p id="status" class="note" aria-live="polite">Connecting to the base...</p>
  </main>

  <!-- The seat picker, once 2 or 4 players is chosen. Laptops only: a headset goes straight to the Astronaut. -->
  <div id="lobby" hidden></div>
  <button id="back" class="ghost" type="button" hidden>Back</button>

  <footer class="site">
    <span>89.45&deg; S, 222.69&deg; E &middot; terrain from NASA LOLA</span>
    <a class="adminlink" href="/admin">Admin</a>
  </footer>

  <noscript><p style="padding:2em">Moonbase needs JavaScript.</p></noscript>
  <script type="module" src="/landing.js"></script>
</body>
</html>
