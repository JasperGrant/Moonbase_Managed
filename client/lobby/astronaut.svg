<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1800" preserveAspectRatio="xMidYMid slice">
  <!-- The astronaut on the lunar south pole, seen from slightly below. Sun low on the right, Earth on the horizon. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#010103"/><stop offset=".55" stop-color="#03060d"/><stop offset="1" stop-color="#0a1222"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8d8f96"/><stop offset=".35" stop-color="#5f6168"/><stop offset=".75" stop-color="#26272c"/><stop offset="1" stop-color="#08080a"/>
    </linearGradient>
    <linearGradient id="suit" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7c8592"/><stop offset=".45" stop-color="#d9dde3"/><stop offset=".8" stop-color="#ffffff"/><stop offset="1" stop-color="#eef1f5"/>
    </linearGradient>
    <linearGradient id="suitDark" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#535b66"/><stop offset=".6" stop-color="#aeb5bf"/><stop offset="1" stop-color="#d5d9df"/>
    </linearGradient>
    <radialGradient id="visor" cx=".62" cy=".35" r=".8">
      <stop offset="0" stop-color="#ffe9a3"/><stop offset=".35" stop-color="#d9a636"/><stop offset=".8" stop-color="#7a5212"/><stop offset="1" stop-color="#3b2706"/>
    </radialGradient>
    <radialGradient id="earth" cx=".7" cy=".35" r=".75">
      <stop offset="0" stop-color="#8fd1ff"/><stop offset=".5" stop-color="#2f78c4"/><stop offset="1" stop-color="#0b2346"/>
    </radialGradient>
    <radialGradient id="earthGlow" cx=".5" cy=".5" r=".5">
      <stop offset=".6" stop-color="#5aa8ff" stop-opacity=".35"/><stop offset="1" stop-color="#5aa8ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shadow" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0" stop-color="#000" stop-opacity=".75"/><stop offset="1" stop-color="#000" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="visorClip"><ellipse cx="452" cy="572" rx="72" ry="62"/></clipPath>
  </defs>

  <rect width="900" height="1800" fill="url(#sky)"/>

  <!-- stars -->
  <g fill="#fff">
    <circle cx="80" cy="330" r="1.6" opacity=".8"/><circle cx="150" cy="420" r="1.1"/><circle cx="230" cy="310" r="1.4" opacity=".6"/>
    <circle cx="310" cy="380" r="1" opacity=".7"/><circle cx="640" cy="320" r="1.8"/><circle cx="720" cy="400" r="1.2" opacity=".7"/>
    <circle cx="810" cy="350" r="1.5" opacity=".9"/><circle cx="560" cy="440" r="1" opacity=".6"/><circle cx="110" cy="560" r="1.3" opacity=".7"/>
    <circle cx="200" cy="660" r="1.7"/><circle cx="90" cy="760" r="1" opacity=".5"/><circle cx="260" cy="820" r="1.2" opacity=".6"/>
    <circle cx="700" cy="560" r="1.1" opacity=".7"/><circle cx="790" cy="640" r="1.6"/><circle cx="760" cy="760" r="1" opacity=".5"/>
    <circle cx="620" cy="700" r="1.3" opacity=".6"/><circle cx="840" cy="860" r="1.1" opacity=".6"/><circle cx="160" cy="900" r="1.4" opacity=".7"/>
    <circle cx="420" cy="350" r="1.2" opacity=".5"/><circle cx="500" cy="300" r="1.5" opacity=".8"/><circle cx="40" cy="470" r="1" opacity=".6"/>
    <circle cx="860" cy="500" r="1.2" opacity=".6"/><circle cx="350" cy="460" r="1" opacity=".4"/><circle cx="60" cy="980" r="1.1" opacity=".5"/>
  </g>

  <!-- Earth, low on the horizon -->
  <circle cx="700" cy="955" r="95" fill="url(#earthGlow)"/>
  <circle cx="700" cy="955" r="58" fill="url(#earth)"/>
  <path d="M668 930 q14 -8 26 2 q10 8 24 2 q-8 14 -26 12 q-14 -2 -24 -16z M690 975 q16 -4 30 6 q-12 10 -30 -6z" fill="#fff" opacity=".75"/>
  <path d="M700 897 a58 58 0 0 0 0 116 a40 58 0 0 1 0 -116z" fill="#02060e" opacity=".75"/>

  <!-- far ridge and the habitat in the distance -->
  <path d="M0 1050 L0 1010 Q90 985 170 1000 Q260 1018 330 996 Q420 970 520 1004 Q620 1030 760 1000 Q840 985 900 1004 L900 1050Z" fill="#3a3c42"/>
  <g transform="translate(200 1004)">
    <path d="M-34 0 a34 26 0 0 1 68 0z" fill="#c9ced6"/>
    <path d="M-34 0 a34 26 0 0 1 34 -26 v26z" fill="#7d838d"/>
    <rect x="-46" y="-2" width="92" height="6" fill="#9aa0aa"/>
    <rect x="30" y="-40" width="2" height="40" fill="#9aa0aa"/><circle cx="31" cy="-42" r="3" fill="#ff5c5c"/>
  </g>

  <!-- the ground -->
  <path d="M0 1040 Q200 1030 450 1046 Q700 1060 900 1040 L900 1800 L0 1800Z" fill="url(#ground)"/>
  <g fill="#000" opacity=".35">
    <ellipse cx="140" cy="1120" rx="70" ry="12"/><ellipse cx="760" cy="1150" rx="90" ry="14"/>
    <ellipse cx="640" cy="1260" rx="60" ry="10"/><ellipse cx="190" cy="1300" rx="110" ry="18"/>
  </g>
  <g fill="#b7b9c0" opacity=".35">
    <path d="M70 1112 a70 12 0 0 1 140 0 a70 8 0 0 0 -140 0z"/><path d="M670 1143 a90 14 0 0 1 180 0 a90 9 0 0 0 -180 0z"/>
    <path d="M80 1292 a110 18 0 0 1 220 0 a110 12 0 0 0 -220 0z"/>
  </g>
  <!-- long south-pole shadow, thrown to the left by the low sun -->
  <path d="M400 1392 L60 1470 L20 1440 L380 1370Z" fill="url(#shadow)"/>
  <!-- a few rocks with their own long shadows -->
  <g><path d="M760 1330 q14 -18 30 -2 q6 10 -4 14z" fill="#9b9ea6"/><path d="M760 1342 L640 1360 L760 1334z" fill="#000" opacity=".5"/></g>
  <g><path d="M560 1200 q10 -12 20 0z" fill="#9b9ea6"/><path d="M560 1200 L470 1210 L562 1196z" fill="#000" opacity=".45"/></g>

  <!-- the astronaut -->
  <g>
    <!-- backpack, peeking out on both sides -->
    <rect x="318" y="660" width="268" height="300" rx="26" fill="#9aa2ad"/>
    <!-- legs -->
    <path d="M372 990 L360 1210 Q356 1270 362 1330 L430 1330 Q440 1250 446 1180 L452 1000Z" fill="url(#suitDark)"/>
    <path d="M456 1000 L466 1180 Q470 1250 478 1330 L548 1330 Q552 1260 548 1210 L532 990Z" fill="url(#suit)"/>
    <path d="M362 1180 h80 M470 1180 h80" stroke="#6b737e" stroke-width="6" opacity=".5"/>
    <!-- boots -->
    <path d="M348 1322 h92 q10 0 12 30 q2 26 -10 30 h-104 q-12 -6 -4 -30z" fill="#5d646f"/>
    <path d="M468 1322 h92 q12 0 14 30 q2 26 -10 30 h-100 q-12 -6 -6 -30z" fill="#8f97a2"/>
    <path d="M338 1380 h112 M458 1380 h116" stroke="#2a2e34" stroke-width="8"/>
    <!-- torso -->
    <path d="M338 700 Q338 660 380 650 L520 650 Q566 660 566 700 L572 960 Q560 1010 452 1012 Q344 1010 332 960Z" fill="url(#suit)"/>
    <!-- chest control box -->
    <rect x="392" y="760" width="122" height="80" rx="8" fill="#c3c8cf" stroke="#7a828d" stroke-width="3"/>
    <circle cx="418" cy="786" r="9" fill="#ff5c5c"/><circle cx="446" cy="786" r="9" fill="#58e08a"/><circle cx="474" cy="786" r="9" fill="#ffb84a"/>
    <rect x="406" y="806" width="94" height="20" rx="3" fill="#3a3f46"/>
    <path d="M404 846 q-10 40 6 80 M500 846 q10 40 -6 80" stroke="#7a828d" stroke-width="5" fill="none"/>
    <!-- mission patch and flag -->
    <rect x="520" y="700" width="34" height="22" fill="#2e5aa8"/><rect x="520" y="700" width="34" height="3" fill="#fff"/>
    <circle cx="362" cy="712" r="14" fill="#2a3a5c" stroke="#ffb84a" stroke-width="3"/>
    <!-- waist ring -->
    <path d="M334 950 Q452 985 570 950" stroke="#7a828d" stroke-width="10" fill="none"/>
    <!-- arms -->
    <path d="M340 690 Q300 700 292 760 L280 930 Q282 960 312 962 L330 960 L346 790Z" fill="url(#suitDark)"/>
    <path d="M564 690 Q604 700 612 760 L624 930 Q622 960 592 962 L574 960 L558 790Z" fill="url(#suit)"/>
    <path d="M286 850 h52 M566 850 h52" stroke="#6b737e" stroke-width="6" opacity=".5"/>
    <!-- gloves -->
    <path d="M280 950 q-6 44 10 70 q24 14 40 -4 q6 -30 -2 -66z" fill="#4c535d"/>
    <path d="M624 950 q6 44 -10 70 q-24 14 -40 -4 q-6 -30 2 -66z" fill="#7d8590"/>
    <!-- neck ring -->
    <ellipse cx="452" cy="654" rx="88" ry="20" fill="#8b939e"/>
    <!-- helmet -->
    <circle cx="452" cy="566" r="104" fill="url(#suit)"/>
    <circle cx="452" cy="566" r="104" fill="none" stroke="#6b737e" stroke-width="4"/>
    <ellipse cx="452" cy="572" rx="80" ry="70" fill="#6f7782"/>
    <ellipse cx="452" cy="572" rx="72" ry="62" fill="url(#visor)"/>
    <!-- the habitat and the ground, reflected and curved in the visor -->
    <g clip-path="url(#visorClip)" opacity=".85">
      <path d="M380 600 Q452 588 524 600 L524 640 L380 640Z" fill="#5a3e0c"/>
      <path d="M418 600 a20 16 0 0 1 40 0z" fill="#ffe7b0"/>
      <rect x="410" y="599" width="56" height="4" fill="#ffe7b0"/>
      <circle cx="492" cy="555" r="7" fill="#cfe7ff" opacity=".8"/>
    </g>
    <path d="M406 530 q30 -28 76 -24" stroke="#fff6d8" stroke-width="7" fill="none" stroke-linecap="round" opacity=".7"/>
    <!-- helmet lamps -->
    <rect x="372" y="482" width="22" height="14" rx="4" fill="#4c535d"/><rect x="510" y="482" width="22" height="14" rx="4" fill="#4c535d"/>
  </g>

  <!-- keep the top and bottom calm for the labels -->
  <rect width="900" height="270" fill="#000" opacity=".35"/>
  <rect y="1440" width="900" height="360" fill="#000" opacity=".25"/>
</svg>
